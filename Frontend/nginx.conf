# =========================================================================
# Frontend/nginx.conf
# -------------------------------------------------------------------------
# PURPOSE
#   Serves the built React app (the output of `npm run build`, a folder
#   of static HTML/JS/CSS) and proxies API calls to the backend so the
#   browser only ever talks to ONE origin -- avoiding CORS entirely in
#   production and giving us a single place to add caching, gzip, and
#   security headers for the whole frontend.
#
#   This file is written for the LATER containerized/production phase
#   (Docker/Kubernetes) mentioned in the brief; for local development
#   you run `npm run dev` (Vite's own dev server) instead -- see the
#   root EXECUTION.md.
#
# HOW IT WOULD BE USED (once we containerize, later)
#   FROM nginx:alpine
#   COPY --from=build /app/dist /usr/share/nginx/html
#   COPY nginx.conf /etc/nginx/conf.d/default.conf
# =========================================================================

server {
    listen 80;
    server_name _;

    # Where the built static files (npm run build -> dist/) live inside
    # the container.
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text-based assets -- meaningfully shrinks the JS bundle over
    # the wire with negligible CPU cost.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # A conservative baseline of security headers for the static site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # API PROXY
    # ---------------------------------------------------------------------
    # Every request to /api/* is forwarded to the API Gateway service.
    # In Docker Compose / Kubernetes, "api-gateway" resolves via the
    # platform's internal DNS to the gateway container/service -- update
    # this host if the gateway is deployed under a different name.
    location /api/ {
        proxy_pass http://api-gateway:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Needed so file-upload requests (documentService) aren't
        # buffered/truncated by nginx before reaching the gateway.
        client_max_body_size 20m;
    }

    # ---------------------------------------------------------------------
    # STATIC ASSETS
    # ---------------------------------------------------------------------
    # Long-lived caching for hashed build assets (Vite fingerprints
    # filenames on every build, so it's always safe to cache these
    # aggressively -- a new build produces new filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------
    # SPA FALLBACK
    # ---------------------------------------------------------------------
    # React Router handles client-side routes like /leads or /invoices.
    # If nginx can't find a matching file/directory for the request, it
    # falls back to index.html so React Router can take over and render
    # the correct page instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html itself -- otherwise browsers might keep
    # serving an old shell that references a deleted/renamed JS bundle
    # after a new deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

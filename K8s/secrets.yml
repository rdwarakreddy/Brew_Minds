# =============================================================================
# SECRETS
# =============================================================================
# What is a Secret?
#   A Kubernetes Secret is a lot like a ConfigMap, except it's meant for
#   sensitive values (passwords, signing keys, credentials). Kubernetes
#   stores them slightly differently from ConfigMaps internally, but the
#   MOST important thing to understand is: a Secret is NOT truly secure
#   by itself. It's just base64-encoded (not encrypted!) unless you turn
#   on extra features on the cluster. Treat it as "sensitive config",
#   never commit real values into this file in Git.
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# !! EVERY VALUE BELOW IS A PLACEHOLDER. NONE OF THEM ARE REAL           !!
# !! CREDENTIALS. Do not deploy this file as-is and do not commit real  !!
# !! values into it in Git.                                             !!
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#
# HOW THIS IS MEANT TO ACTUALLY BE FILLED IN (pick one):
#
#   Option A - Fill it in by hand for a first deploy/demo (simplest):
#     kubectl create secret generic brew-minds-db-credentials \
#       --namespace brew-minds \
#       --from-literal=DB_HOST=<rds_endpoint from Terraform output> \
#       --from-literal=DB_PORT=5432 \
#       --from-literal=DB_USER=<rds_username> \
#       --from-literal=DB_PASSWORD=<rds_password> \
#       --from-literal=DB_NAME=<rds_database_name> \
#       --dry-run=client -o yaml | kubectl apply -f -
#     (repeat the same pattern for the other two Secrets below)
#
#   Option B - Connect these to the AWS Secrets Manager entries
#   Terraform already created (the production-correct approach, so real
#   secrets never touch Git or kubectl at all):
#     Install the "External Secrets Operator" (or the "AWS Secrets
#     Store CSI Driver") into the cluster, then replace each plain
#     Secret below with an ExternalSecret/SecretProviderClass object
#     that pulls its values live from the matching AWS Secrets Manager
#     entry (module.secrets.db_credentials_secret_name /
#     jwt_secret_name / oauth_credentials_secret_name from the
#     Terraform outputs). That controller needs its own IAM role
#     (IRSA) to read Secrets Manager - the EKS Terraform module in this
#     project does NOT yet create that role (it only created IRSA roles
#     for the EBS CSI driver and the AWS Load Balancer Controller), so
#     that's a small addition needed on the Terraform side before
#     Option B can work. This is intentionally flagged rather than
#     silently assumed.
#
# The three Secrets below map 1:1 to the three AWS Secrets Manager
# entries Terraform's `secrets` module already creates, so whichever
# option you pick, the shape (which keys exist) stays the same.
# =============================================================================

# -----------------------------------------------------------------------
# DATABASE CREDENTIALS
# Mirrors Terraform's `db-credentials` secret. Used by every backend
# service that talks to Postgres (everything except api-gateway - see
# each service's db.js).
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: brew-minds-db-credentials
  namespace: brew-minds
type: Opaque
stringData:
  DB_HOST: "REPLACE_WITH_RDS_ENDPOINT" # Terraform output: rds_endpoint (host only, no port)
  DB_PORT: "5432"
  DB_USER: "REPLACE_WITH_DB_USERNAME" # Terraform variable: rds_username
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD" # Terraform variable: rds_password
  DB_NAME: "REPLACE_WITH_DB_NAME" # Terraform variable: rds_database_name

---
# -----------------------------------------------------------------------
# JWT SIGNING SECRETS
# Mirrors Terraform's `jwt-secret` secret.
#   JWT_ACCESS_SECRET  - used by EVERY backend service (except
#                        api-gateway) to VERIFY a user's access token
#                        (see shared authMiddleware.js in every service).
#   JWT_REFRESH_SECRET - used ONLY by auth, to sign/verify refresh
#                        tokens (see authService/src/utils/tokens.js).
#
# ⚠ GAP FOUND WHILE INSPECTING THE PROJECT: the Terraform `secrets`
# module currently only stores a `jwt_access_secret` field inside AWS
# Secrets Manager. The application code also genuinely requires a
# SEPARATE JWT_REFRESH_SECRET (see authController.js / tokens.js -
# access and refresh tokens are deliberately signed with two different
# secrets). This Kubernetes Secret includes both keys, as the
# application needs, but the Terraform module would need a small update
# (adding a `jwt_refresh_secret` field) before this could be wired up
# to AWS Secrets Manager end-to-end. Flagging this rather than quietly
# reusing one secret for both, which would weaken the intended
# access/refresh token separation.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: brew-minds-jwt-secret
  namespace: brew-minds
type: Opaque
stringData:
  JWT_ACCESS_SECRET: "REPLACE_WITH_A_LONG_RANDOM_ACCESS_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_A_DIFFERENT_LONG_RANDOM_REFRESH_SECRET"

---
# -----------------------------------------------------------------------
# GOOGLE OAUTH CREDENTIALS
# Mirrors Terraform's `oauth-credentials` secret. Used ONLY by auth,
# to verify "Sign in with Google" tokens (see
# authService/src/utils/googleAuth.js). Note: only GOOGLE_CLIENT_ID is
# actually read by the backend code - no GOOGLE_CLIENT_SECRET is used
# anywhere in this application (Google Identity Services' ID-token flow
# doesn't need one), even though Terraform's secret happens to store a
# google_oauth_client_secret field too. That field is simply unused by
# the app as it stands today.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: brew-minds-oauth-credentials
  namespace: brew-minds
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID"

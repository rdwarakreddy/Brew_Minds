# =============================================================================
# INVOICES SERVICE
# =============================================================================
# Gives the "invoices" Pods a stable internal name/address so other
# services can always reach them
# even as individual Pods restart. See ../../frontend/service.yml for a
# full explanation of what a Service is and why ClusterIP is used.
#
# type: ClusterIP -> internal-only. Only reachable from inside the cluster - exactly what we want for an
# internal backend service (see "DO NOT USE PUBLIC IPs" in the project brief).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: invoices
  namespace: brew-minds
spec:
  type: ClusterIP
  selector:
    app: invoices
  ports:
    - port: 5009
      targetPort: 5009
